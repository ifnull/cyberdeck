; Cyberdeck renogy-agent config.
; See renogy-agent/README.md for setup and tuning.

[device]
adapter   = hci0
mac_addr  = XX:XX:XX:XX:XX:XX         ; replace with BT-1 MAC from `bluetoothctl scan on`
alias     = BT-TH-XXXXXXXX            ; optional; matches the BT-1's advertised name
type      = RNG_CTRL                  ; Wanderer / Rover / Adventurer
device_id = 1                         ; Wanderer 10A factory default — NOT 255

[data]
enable_polling   = true
poll_interval    = 60                 ; seconds between read cycles
temperature_unit = F
fields           =                    ; blank = all fields

[remote_logging]
enabled = false

[mqtt]
enabled = false
; server   = 127.0.0.1
; port     = 1883
; topic    = cyberdeck/renogy
; user     =
; password =

[pvoutput]
enabled = false
